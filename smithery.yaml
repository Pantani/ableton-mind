# Smithery configuration — https://smithery.ai/docs/build/project-config/smithery.yaml
#
# ableton-mind is a local stdio MCP server: it drives a Remote Script bridge
# running inside Ableton Live on the same machine (default 127.0.0.1:9876), so
# the public listing should install the npm package and let the user run the
# Ableton bridge locally.
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      abletonHost:
        type: string
        default: "127.0.0.1"
        description: Host of the Ableton Live Remote Script bridge.
      abletonPort:
        type: integer
        default: 9876
        description: TCP port of the Ableton Live Remote Script bridge.
      logLevel:
        type: string
        enum: [debug, info, warn, error]
        default: info
        description: Log level for the local MCP server.
  commandFunction: |
    (config) => ({
      command: "npx",
      args: ["-y", "ableton-mind"],
      env: {
        ...(config.abletonHost && { ABLETON_MIND_HOST: config.abletonHost }),
        ...(config.abletonPort && { ABLETON_MIND_PORT: String(config.abletonPort) }),
        ...(config.logLevel && { ABLETON_MIND_LOG_LEVEL: config.logLevel })
      }
    })
  exampleConfig:
    abletonHost: "127.0.0.1"
    abletonPort: 9876
    logLevel: info
