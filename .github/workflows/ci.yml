name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Validate bin entries
        run: |
          test -f dist/index.js
          test -f dist/cli/doctor.js
      - name: build:dxt:check (no Live needed)
        run: npm run build:dxt:check

  python:
    name: Python bridge (Live ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Live 11 = Py 3.7. Live 12 = Py 3.11. Live 12.1+ = Py 3.11+.
        include:
          - { os: ubuntu-latest, python: "3.7" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: macos-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run bridge unittests
        working-directory: live
        run: python -m unittest discover -s AbletonMind/tests -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ableton-mind:ci
